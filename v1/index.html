function banner(){return note(`<strong>${tr('riskHeading')}:</strong> ${tr('riskText')}`,'critical')}
function home(){return `<div class="hero"><div><div class="overline" style="color:#b4e9e5">${tr('heroEyebrow')}</div><h2>${tr('introTitle')}</h2><p>${tr('introText')}</p>${btn(tr('start'),'sample','outline')}</div><div class="hero-mark" aria-hidden="true">⌁</div></div>
<div class="grid"><section class="panel s4"><div class="stat-label">${tr('sampleLabel')}</div><div class="stat-value">${state.case.case_id}</div><div class="stathelp"><i>${state.case.organism}</i></div></section><section class="panel s4"><div class="stat-label">${tr('quality')}</div><div class="stat-value">${tr('notSequenced')}</div><div class="stathelp">${tr('caseHint')}</div></section><section class="panel s4"><div class="stat-label">${tr('status')}</div><div class="stat-value" style="font-size:18px">${state.completed?tr('done'):tr('notDone')}</div><div class="stathelp">${tr('noTreatment')}</div></section><section class="panel s12"><h3>${tr('stepsTitle')}</h3><div class="flow">${tr('flow').map((f,i)=>`<div class="flowitem"><span class="flow-index">0${i+1}</span><b>${f[0]}</b><small>${f[1]}</small></div>`).join('')}</div><p class="callmark">${tr('workflowNote')}</p></section><section class="panel s4"><h3>${tr('role1')}</h3><p class="sub">${tr('role1Text')}</p></section><section class="panel s4"><h3>${tr('role2')}</h3><p class="sub">${tr('role2Text')}</p></section><section class="panel s4"><h3>${tr('role3')}</h3><p class="sub">${tr('role3Text')}</p></section></div>`;}
function sample(){let c=DEMO_CASES[state.selected];return `${heading('02 / 05',tr('selectTitle'),tr('selectDesc'))}${note(`<strong>${tr('illustrative')}.</strong> ${tr('caseHint')}`)}<div class="grid"><section class="panel s7"><h3>${tr('sel')}</h3><label for="caseSelect" class="fieldlabel">${tr('sampleLabel')}</label><select class="field" id="caseSelect">${Object.values(DEMO_CASES).map(c=>`<option value="${c.case_id}" ${c.case_id===state.selected?'selected':''}>${c.case_id} · ${c.organism}</option>`).join('')}</select><p class="fieldnote">${c.markers.length} ${tr('recordNum').toLowerCase()} · ${tr('caseSource')}</p><div class="actions"><button id="useCase" class="action">${tr('useSample')}</button></div><hr style="border:0;border-top:1px solid #e4edf1;margin:22px 0"><details><summary>${tr('importTitle')}</summary><div class="filebox"><p class="sub">${tr('importDesc')}</p><label for="caseFile" class="fieldlabel">${tr('importBtn')}</label><input id="caseFile" type="file" accept=".json,application/json" /><p class="fieldnote">${tr('onlyDemo')}</p></div></details><div id="feedback" aria-live="polite" style="margin-top:12px"></div></section><section class="panel s5"><h3>${tr('loaded')}</h3>${caseInfo(state.case)}<div class="actions">${btn(tr('next')+' →','check','outline')}</div></section></div><div style="margin-top:15px">${note(`<strong>${tr('riskHeading')}.</strong> ${tr('privacy')}`)}</div>`;}
function check(){const c=state.case;return `${heading('03 / 05',tr('checkTitle'),tr('checkDesc'))}<div class="grid"><section class="panel s7"><h3>${tr('sampleCheck')}</h3><div class="keyval"><span>${tr('sampleLabel')}</span><strong>${escapeHTML(c.case_id)} · ${escapeHTML(c.organism)}</strong></div><div class="keyval"><span>${tr('format')}</span><span class="pill">${tr('schemaOK')}</span></div><div class="keyval"><span>${tr('quality')}</span><strong>${tr('notSequenced')}</strong></div><div style="margin-top:20px" class="stat-label">${tr('progress')}</div><div class="progress"><span style="width:${state.completed?'100':'22'}%"></span></div><p class="sub">${state.completed?tr('completed'):tr('wait')}</p><div class="actions"><button id="run" class="action">${state.completed?tr('rerun'):tr('run')}</button>${btn(tr('back'),'sample','outline')}</div><p class="callmark">${tr('limAnalysis')}</p></section><section class="panel s5"><h3>${tr('process')}</h3>${tr('checks').map((n,i)=>`<div class="phase"><div class="phase-circle">✓</div><div><b>${n}</b><small>${tr('checkInfo')[i]}</small></div></div>`).join('')}</section></div>`;}
function empty(){return `<div class="empty"><h3>${tr('emptyTitle')}</h3><p>${tr('emptyDesc')}</p>${btn(tr('goCheck'),'check')}</div>`}
function findings(){if(!state.completed)return `${heading('04 / 05',tr('findTitle'),tr('findDesc'))}${empty()}`;
return `${heading('04 / 05',tr('findTitle'),tr('findDesc'),btn(tr('openReport')+' →','report','outline'))}${banner()}<div class="grid"><section class="panel s4"><div class="stat-label">${tr('sampleLabel')}</div><div class="stat-value">${escapeHTML(state.case.case_id)}</div><div class="stathelp"><i>${escapeHTML(state.case.organism)}</i></div></section><section class="panel s4"><div class="stat-label">${tr('recordNum')}</div><div class="stat-value">${state.case.markers.length}</div><div class="stathelp">${tr('illustrative')}</div></section><section class="panel s4"><div class="stat-label">${tr('status')}</div><div class="stat-value" style="font-size:16px">${tr('noHigh')}</div><div class="stathelp">${tr('needConfirm')}</div></section><section class="panel s12"><h3>${tr('findingTitle')}</h3><div class="tablewrap"><table class="table"><thead><tr>${tr('findingTable').map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${state.case.markers.map(m=>`<tr><td><strong>${escapeHTML(m.gene)}</strong><span class="desc">${tr('illustrative')}</span></td><td>${cv(m)}</td><td>${tr('geneNotes')[m.gene]??tr('noHigh')}</td><td><span class="pill ${m.strength==='limited'?'amber':'gray'}">${strengthText(m.strength)}</span></td></tr>`).join('')||`<tr><td colspan="4">${tr('noMarker')}</td></tr>`}</tbody></table></div></section><section class="panel s12"><h3>${tr('clinicalInterpret')}</h3><p>${tr('interpretText')}</p><p class="sub">${tr('unvalidated')}</p><div class="actions">${btn(tr('openReport')+' →','report')}</div></section></div>`;}
function astSelect(m,i){let options=['Not tested','Resistant','Susceptible'];return `<div class="astrow"><div><b>${escapeHTML(m.gene)}</b><small>${cv(m)}</small></div><label><span class="sr-only">${tr('phenotype')}</span><select class="field ast-value" data-i="${i}" aria-label="${tr('phenotype')} ${escapeHTML(m.gene)}">${options.map(v=>`<option value="${v}" ${v===m.phenotype?'selected':''}>${astText(v)}</option>`).join('')}</select></label></div>`;}
function reportDocument(){const c=state.case;return `<article class="report print-area" id="printDocument"><div class="report-head"><div><div class="report-kicker">GENOSCAN / MVP V1</div><h2>${tr('reportHeader')}</h2><p class="sub">${tr('reportSub')}</p></div><span class="pill amber">${tr('illustrative')}</span></div><div class="kv"><span>${tr('caseLabel')}</span><strong>${escapeHTML(c.case_id)}</strong></div><div class="kv"><span>${tr('reportSpecies')}</span><strong><i>${escapeHTML(c.organism)}</i></strong></div><div class="kv"><span>${tr('reportData')}</span><strong>${tr('caseSource')}</strong></div><div class="kv"><span>${tr('db')}</span><strong>GenoScan demo fixtures V1</strong></div><h3>${tr('reportFind')}</h3><table class="reporttable"><thead><tr>${tr('repTable').map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${c.markers.map(m=>`<tr><td>${escapeHTML(m.gene)}</td><td>${cv(m)}</td><td>${strengthText(m.strength)}. ${tr('geneNotes')[m.gene]??''}</td></tr>`).join('')||`<tr><td colspan="3">${tr('noMarker')}</td></tr>`}</tbody></table><h3>${tr('reportAST')}</h3><table class="reporttable"><thead><tr>${tr('astTable').map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${c.markers.map(m=>`<tr><td>${cv(m)}</td><td>${astText(m.phenotype)}</td><td>${tr(cmp(m.phenotype))}</td></tr>`).join('')||`<tr><td colspan="3">—</td></tr>`}</tbody></table><h3>${tr('reportLimits')}</h3><p>${tr('reportLimitText')}</p><p><strong>${tr('doctorFinal')}</strong></p><div class="reportstamp">${tr('stamp')}</div></article>`}
function report(){if(!state.completed)return `${heading('05 / 05',tr('reportTitle'),tr('reportDesc'))}${empty()}`;
let match=state.case.markers.filter(m=>cmp(m.phenotype)==='accord').length;let discord=state.case.markers.filter(m=>cmp(m.phenotype)==='discord').length;let pending=state.case.markers.filter(m=>cmp(m.phenotype)==='pending').length;
return `${heading('05 / 05',tr('reportTitle'),tr('reportDesc'))}${banner()}<div class="grid"><section class="panel s12 no-print"><div class="report-controls"><div><h3 class="tight">${tr('astTitle')}</h3><p class="sub" style="margin:5px 0 0">${tr('astDesc')}</p></div><button class="action outline sm" id="resetAst">${tr('reset')}</button></div><div style="margin-top:8px">${state.case.markers.map(astSelect).join('')}</div><div class="alert green" style="margin:15px 0 0"><strong>${tr('astCounts')}:</strong> ${match} ${tr('agreementText')}, ${discord} ${tr('disagreeText')}, ${pending} ${tr('untestedText')}. ${tr('astNote')}</div></section><div class="s12 no-print report-controls" style="margin-top:1px"><div><b>${tr('reportPreview')}</b><p class="sub">${tr('saveHelp')}</p></div><div class="actions" style="margin:0"><button id="print" class="action">${tr('print')}</button><button id="export" class="action outline">${tr('export')}</button></div></div><div class="s12">${reportDocument()}</div></div>`;}
function validateImported(d){if(!d||typeof d!=='object'||Array.isArray(d)||d.demo_only!==true||!/\bSYN-[A-Za-z0-9_-]{1,24}\b/.test(d.case_id||''))throw Error(tr('onlyDemo'));
const raw=JSON.stringify(d);if(/patient[_-]?id|full[_-]?name|birth[_-]?date|medical[_-]?record|passport|phone|email|address/i.test(raw))throw Error(tr('privacy'));
if(typeof d.organism!=='string'||d.organism.length>80||!Array.isArray(d.markers)||d.markers.length>12||!d.markers.every(m=>m&&typeof m.gene==='string'&&m.gene.length<35&&typeof m.class_id==='string'&&['classCarb','classBeta','classMeth','classCeph'].includes(m.class_id)&&['limited','strong'].includes(m.strength)&&['Not tested','Resistant','Susceptible'].includes(m.phenotype)))throw Error(tr('onlyDemo'));
return {demo_only:true,case_id:d.case_id.slice(0,32),organism:d.organism.slice(0,80),source:'synthetic',markers:d.markers.map(m=>({gene:m.gene.slice(0,34),class_id:m.class_id,strength:m.strength,phenotype:m.phenotype}))};}
function render(){document.documentElement.lang=state.lang;document.title=`GenoScan · ${tr('top')[PAGES.indexOf(state.page)]}`;
document.getElementById('sidetag').textContent=state.lang==='ru'?'Медицинский интерфейс · демоверсия':'Медициналық интерфейс · демонұсқа';document.getElementById('sideinfo').innerHTML=tr('side');document.getElementById('topTitle').textContent=tr('top')[PAGES.indexOf(state.page)];document.getElementById('demotag').textContent=tr('demo');
for(const v of ['ru','kk']){let el=document.getElementById('lang'+v);el.classList.toggle('active',v===state.lang);el.setAttribute('aria-pressed',String(v===state.lang));}
document.getElementById('nav').innerHTML=`<div class="navheading">${tr('navlabel')}</div>`+tr('nav').map((name,i)=>`<button type="button" class="navbtn ${PAGES[i]===state.page?'active':''}" data-page="${PAGES[i]}" ${PAGES[i]===state.page?'aria-current="page"':''}><span class="navicon">${i+1}</span>${name}</button>`).join('');
const root=document.getElementById('main');root.innerHTML=state.page==='home'?home():state.page==='sample'?sample():state.page==='check'?check():state.page==='find'?findings():report();}
document.addEventListener('click',e=>{const language=e.target.closest('[data-lang]');if(language){state.lang=language.dataset.lang;render();return;}
const page=e.target.closest('[data-page]');if(page){addPage(page.dataset.page);return;}
const id=e.target.id;if(id==='useCase'){state.case=structuredClone(DEMO_CASES[state.selected]);state.completed=false;state.message=tr('loadSuccess');addPage('check');return;}if(id==='run'){state.completed=true;addPage('find');return;}if(id==='resetAst'){state.case.markers.forEach(m=>m.phenotype='Not tested');render();return;}
if(id==='print'){window.print();return;}if(id==='export'){const blob=new Blob([JSON.stringify(state.case,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='GenoScan_'+state.case.case_id+'_DEMO.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);return;}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='caseSelect'){state.selected=el.value;render();return;}
if(el.classList.contains('ast-value')){const m=state.case.markers[Number(el.dataset.i)];if(m){m.phenotype=el.value;render();}return;}
if(el.id==='caseFile'){const file=el.files?.[0];if(!file)return;const fb=document.getElementById('feedback');try{if(file.size>256000)throw Error(tr('onlyDemo'));const obj=JSON.parse(await file.text());state.case=validateImported(obj);state.completed=false;state.selected='SYN-001';addPage('check');}catch(err){fb.innerHTML=note(`<strong>${tr('invalidFile')}:</strong> ${escapeHTML(err.message)}`,'critical');}finally{el.value='';}}});
render();
</script></body></html>
