function astResultText(a){return a==='R'?t('labResistant'):a==='S'?t('labSusceptible'):a==='I'?t('labIntermediate'):t('labPending')}
function ast(){let entries=[['Ceftriaxone',t('resistance'),'R',t('match')],['Ciprofloxacin',t('unknown'),'I',t('partial')],['Meropenem',t('noSignal'),'S',t('undetermined')]];return `${headings(t('pageTitles').ast,t('astLead'),btn(t('showReport'),'report'))}<div class="grid"><div class="card c12"><div class="callout warning">${t('astExplain')}</div><div class="table-scroll"><table class="data-table"><thead><tr>${t('astTable').map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${entries.map((e,i)=>`<tr><td><strong>${e[0]}</strong></td><td><span class="pill ${i===0?'red':'warn'}">${e[1]}</span></td><td><select class="field astInput" data-index="${i}"><option value="R" ${state.ast[i]==='R'?'selected':''}>${t('labResistant')}</option><option value="I" ${state.ast[i]==='I'?'selected':''}>${t('labIntermediate')}</option><option value="S" ${state.ast[i]==='S'?'selected':''}>${t('labSusceptible')}</option><option value="U" ${state.ast[i]==='U'?'selected':''}>${t('labPending')}</option></select></td><td><span class="pill ${i===0 && state.ast[i]==='R'?'':'warn'}">${i===0 && state.ast[i]==='R'?t('match'):i===1?t('partial'):t('undetermined')}</span></td></tr>`).join('')}</tbody></table></div><p class="micro" style="margin-top:16px">${t('savedAst')}</p></div><div class="card c12"><div class="buttonrow">${btn(t('viewEvidence'),'evidence')}${btn(t('showReport'),'report','light')}</div></div></div>`}
function evidence(){return `${headings(t('pageTitles').evidence,t('localLead'))}<div class="grid">${cardStat(t('localDemo'),t('pairCount'),t('evidenceDisclaimer'))}${cardStat(t('localDemo'),t('orgCount'),t('notClinical'))}${cardStat(t('localDemo'),t('validationCount'),t('notClinical'))}${cardStat(t('dbVersion'),'V2',t('localLimit'))}<div class="card c12"><h3>${t('localTable')[0]} · ${t('localDemo')}</h3><div class="table-scroll"><table class="data-table"><thead><tr>${t('localTable').map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><td>SYN-KZ-001</td><td>blaCTX-M-15</td><td>${t('labResistant')}</td><td>${t('match')}</td></tr><tr><td>SYN-KZ-002</td><td>blaKPC-2</td><td>${t('labResistant')}</td><td>${t('match')}</td></tr><tr><td>SYN-KZ-003</td><td>qnrS1</td><td>${t('labIntermediate')}</td><td>${t('partial')}</td></tr></tbody></table></div><div class="callout warning">${t('localLimit')}</div></div></div>`}
function reportHtml(){return `<div class="report-paper" id="report-paper"><div class="report-head"><div><div class="brand">${logo()} GenoScan</div><h2 style="margin-top:17px">${t('reportTitle')}</h2><div class="micro">GS-125 · Synthetic case · 26.10.2026</div></div><span class="demo">${t('demo')}</span></div><div class="kv"><span>${t('caseId')}</span><b>${esc(state.caseId)}</b></div><div class="kv"><span>${t('organism')}</span><b><i>${esc(state.org)}</i></b></div><div class="kv"><span>${t('dbVersion')}</span><b>Synthetic AMR fixtures V2</b></div><h3>${t('reportSummary')}</h3><div class="summary"><p>${t('shortText')}</p></div><h3>${t('reportMarker')}</h3><div class="table-scroll"><table class="data-table"><thead><tr><th>${t('markerHeader')[0]}</th><th>${t('markerHeader')[1]}</th><th>${t('markerHeader')[2]}</th></tr></thead><tbody><tr><td>blaCTX-M-15</td><td>β-lactams</td><td>${t('signal')}</td></tr><tr><td>qnrS1</td><td>Quinolones</td><td>${t('unknown')}</td></tr></tbody></table></div><h3>${t('reportAST')}</h3><div class="callout warning">${t('importantNoticeBody')}</div><div class="table-scroll"><table class="data-table"><thead><tr><th>${t('astTable')[0]}</th><th>${t('astTable')[2]}</th></tr></thead><tbody><tr><td>Ceftriaxone</td><td>${astResultText(state.ast[0])}</td></tr><tr><td>Ciprofloxacin</td><td>${astResultText(state.ast[1])}</td></tr><tr><td>Meropenem</td><td>${astResultText(state.ast[2])}</td></tr></tbody></table></div><h3>${t('reportTrace')}</h3><div class="micro">${t('qcDemo')}<br>${t('confNot')}</div><h3>${t('reportLimit')}</h3><p>${t('reportLimitBody')}</p><div class="reportfooter">${t('scopeNote')}</div></div>`}
function report(){return `${headings(t('pageTitles').report,t('reportLead'))}<div class="buttonrow no-print" style="justify-content:flex-end;margin-bottom:17px"><button id="printReport" class="btn">${t('printPDF')}</button><button id="downloadReport" class="btn light">${t('downloadHTML')}</button></div>${reportHtml()}`}
function settings(){return `${headings(t('pageTitles').settings,t('settingsLead'))}<div class="grid"><div class="card c6"><h3>${t('available')}</h3><div class="stack">${t('availItems').map(x=>`<div class="stepRow"><span class="pill">✓</span>${x}</div>`).join('')}</div></div><div class="card c6"><h3>${t('planned')}</h3><div class="stack">${t('futureItems').map(x=>`<div class="stepRow"><span class="pill warn">→</span>${x}</div>`).join('')}</div></div><div class="card c12"><h3>${t('glossary')}</h3><p>${t('g1')}</p><p>${t('g2')}</p><p>${t('g3')}</p><div class="callout warning">${t('scopeNote')}</div></div></div>`}
const handlers={landing,login,dashboard,cases,analysis,findings,ast,evidence,report,settings};
function goto(p){state.page=p;location.hash=p;render();window.scrollTo(0,0)}
function render(){document.documentElement.lang=state.lang==='kk'?'kk':'ru';document.title='GenoScan · '+(t('pageTitles')[state.page]||'MVP V2');document.getElementById('root').innerHTML=(state.page==='landing'||state.page==='login')?handlers[state.page]():shell(handlers[state.page]());}
function loadCase(id){let c=fixtures.find(x=>x.id===id);if(!c)return;state.caseId=c.id;state.org=c.org;state.kind=c.kind;state.selected=c.id;state.progress=c.phase==='done'?100:0;state.ready=c.phase==='done';goto('findings')}
let runTimer=null;
document.addEventListener('click',e=>{let lng=e.target.closest('[data-lang]');if(lng){state.lang=lng.dataset.lang;render();return}let nav=e.target.closest('[data-page]');if(nav){goto(nav.dataset.page);return}let casebtn=e.target.closest('[data-load]');if(casebtn){loadCase(casebtn.dataset.load);return}let id=e.target.id;if(id==='login'){state.role=Number(document.getElementById('role').value)||0;goto('dashboard');return}if(id==='prepare'){state.caseId=(document.getElementById('newId').value||'GS-DEMO').replace(/[^a-zA-Z0-9-_]/g,'').slice(0,20)||'GS-DEMO';state.kind=document.getElementById('caseKind').value;state.org=document.getElementById('newOrganism').value;state.notes=document.getElementById('caseNotes').value.replace(/<[^>]*>/g,'').slice(0,350);state.file=document.getElementById('seqFile').files?.[0]?.name||'';state.progress=0;state.ready=false;goto('analysis');return}if(id==='simulate'){clearInterval(runTimer);state.progress=0;render();runTimer=setInterval(()=>{state.progress=Math.min(100,state.progress+20);render();if(state.progress>=100){clearInterval(runTimer);state.ready=true}},420);return}if(id==='printReport'){window.print();return}if(id==='downloadReport'){let html=`<!doctype html><html lang="${state.lang}"><meta charset="utf-8"><title>GenoScan Demo</title><style>body{font:14px Arial;padding:30px;color:#173050;line-height:1.5}table{width:100%;border-collapse:collapse}td,th{border:1px solid #cad6e2;padding:8px;text-align:left}.demo,.reportfooter{border:1px solid #c6d5e5;background:#fff7eb;padding:12px}</style>${document.getElementById('report-paper').innerHTML}</html>`;let blob=new Blob([html],{type:'text/html;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='GenoScan_'+state.caseId+'_DEMO.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}});
document.addEventListener('change',e=>{if(e.target.id==='role'){state.role=Number(e.target.value)||0}if(e.target.classList.contains('astInput')){state.ast[Number(e.target.dataset.index)]=e.target.value;render()}});
let route=location.hash.slice(1);if(handlers[route])state.page=route;render();
</script></body></html>
